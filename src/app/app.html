<main class="container">
  <section class="card">
    <h1>Clasificador de Imágenes (HOG + KNN)</h1>

    <div class="upload-section">
      <label for="fileInput" class="file-label">
        {{ selectedFile() ? selectedFile()?.name : 'Seleccionar imagen...' }}
      </label>
      <input
        id="fileInput"
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)"
        hidden
      />
    </div>

    @if (imagePreview()) {
      <div class="preview-container">
        <img [src]="imagePreview()" alt="Vista previa de la imagen" />
      </div>
    }

    <button
      class="btn-predict"
      (click)="clasificarImagen()"
      [disabled]="!selectedFile() || isLoading()"
    >
      {{ isLoading() ? 'Clasificando...' : 'Ejecutar Modelo de Clasificación' }}
    </button>

    @if (errorMessage()) {
      <p class="error-msg">{{ errorMessage() }}</p>
    }

    <div class="results-section">
      <label for="resultBox">Resultados de Clasificación (Porcentajes y Probabilidades)</label>
      <textarea
        id="resultBox"
        rows="8"
        readonly
        [value]="resultText()"
        placeholder="Los porcentajes y probabilidades aparecerán aquí..."
      ></textarea>
    </div>
  </section>
</main>
